<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brevmont is installed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:'Inter','-apple-system','BlinkMacSystemFont','Segoe UI',Helvetica,Arial,sans-serif;background:#F8F6F1;color:#0F1419;min-height:100vh}
.shell{max-width:560px;margin:0 auto;padding:64px 24px}
.wordmark{font-size:20px;font-weight:700;letter-spacing:-0.02em;margin-bottom:48px}
.title{font-size:32px;font-weight:600;line-height:1.25;margin-bottom:12px}
.subhead{font-size:16px;color:#1F2937;line-height:1.6;margin-bottom:32px}
.steps{display:flex;flex-direction:column;gap:24px;margin-bottom:40px}
.step{display:flex;gap:16px;align-items:flex-start}
.step-num{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:#0D6E6E;color:#F8F6F1;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.step-body{flex:1}
.step-caption{font-size:15px;color:#0F1419;font-weight:500;margin-bottom:8px;line-height:1.5}
.step-img{width:100%;max-width:432px;border:1px solid #E5E7EB;border-radius:8px;display:block;background:#fff}
.step-img-fallback{width:100%;max-width:432px;padding:20px 16px;border:1px dashed #E5E7EB;border-radius:8px;background:#fff;font-size:13px;color:#6B7280;line-height:1.5}
.cta{margin-top:24px;display:flex;gap:12px;align-items:center}
.cta .primary{background:#0D6E6E;color:#F8F6F1;border:none;padding:14px 28px;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.cta .primary:hover{opacity:0.92}
.cta .secondary{background:transparent;border:none;color:#6B7280;font-size:13px;cursor:pointer;font-family:inherit;padding:14px 0}
.cta .secondary:hover{color:#0F1419}
.foot{margin-top:64px;padding-top:24px;border-top:1px solid #E5E7EB;font-size:13px;color:#6B7280;line-height:1.6}
.foot a{color:#0D6E6E;text-decoration:none;font-weight:500}
@media (max-width: 600px){
  .shell{padding:32px 16px}
  .title{font-size:24px}
  .step-img,.step-img-fallback{max-width:100%}
}
</style>
</head>
<body>
<div class="shell">
  <div class="wordmark">brevmont</div>
  <h1 class="title">Brevmont is installed.</h1>
  <p class="subhead" id="subhead">One quick step before you use Brevmont in your CRM.</p>

  <div class="steps" id="steps"></div>

  <div class="cta">
    <button class="primary" id="btn-pinned">I pinned it</button>
    <button class="secondary" id="btn-skip">Skip</button>
  </div>

  <div class="foot">
    Trouble pinning? Email <a href="mailto:founder@brevmont.com">founder@brevmont.com</a> or text 307-690-0291. We read every message.
  </div>
</div>

<script type="module" src="./main.ts"></script>
</body>
</html>
