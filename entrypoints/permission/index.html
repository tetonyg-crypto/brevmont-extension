<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brevmont — Microphone Access</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0F1419;
      color: #F8F6F1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .container { text-align: center; max-width: 360px; }
    .icon {
      width: 64px; height: 64px; margin: 0 auto 24px;
      border-radius: 50%; background: rgba(13,110,110,0.15);
      display: flex; align-items: center; justify-content: center;
    }
    .icon svg { width: 32px; height: 32px; fill: #0D6E6E; }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #F8F6F1; }
    p { font-size: 14px; color: rgba(248,246,241,0.7); margin-bottom: 24px; line-height: 1.5; }
    .btn {
      display: inline-block; padding: 12px 28px; background: #0D6E6E;
      color: #F8F6F1; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 500; cursor: pointer; transition: background 0.15s;
    }
    .btn:hover { background: #0A5A5A; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success { display: none; flex-direction: column; align-items: center; gap: 12px; }
    .success svg { width: 48px; height: 48px; fill: #0D6E6E; }
    .success p { color: #F8F6F1; font-weight: 500; }
    .success .sub { font-weight: 400; color: rgba(248,246,241,0.7); font-size: 13px; }
    .btn-close {
      display: inline-block; padding: 10px 24px; background: #0D6E6E;
      color: #F8F6F1; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.15s;
      margin-top: 8px;
    }
    .btn-close:hover { background: #0A5A5A; }
    .skip {
      display: inline-block; margin-top: 16px; color: rgba(248,246,241,0.5);
      font-size: 13px; text-decoration: underline; cursor: pointer;
      background: none; border: none; font-family: inherit;
    }
    .skip:hover { color: rgba(248,246,241,0.8); }
    .error {
      display: none; margin-top: 16px; padding: 12px;
      background: rgba(220,38,38,0.1); border-radius: 8px;
      color: #fca5a5; font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="prompt-state">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      </div>
      <h1>Brevmont needs microphone access</h1>
      <p>Voice input lets you speak customer scenarios instead of typing. This permission is granted once and works everywhere.</p>
      <button class="btn" id="enable-btn">Enable Microphone</button>
      <div class="error" id="error-msg"></div>
      <button class="skip" id="skip-btn">Skip — I don't use voice</button>
    </div>
    <div class="success" id="success-state">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      <p>You're all set!</p>
      <p class="sub">Click the Brevmont icon in your toolbar to get started.</p>
      <button class="btn-close" id="close-btn">Got it</button>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
