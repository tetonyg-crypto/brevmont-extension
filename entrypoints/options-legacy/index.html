<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brevmont Settings</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:#fafafa;padding:32px 24px;color:#1a202c}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:13px;font-weight:700;color:#0D6E6E;letter-spacing:4px;margin-bottom:4px}
.sub{font-size:13px;color:#64748b;margin-bottom:24px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(15,20,25,.05)}
.intro{font-size:13px;color:#64748b;line-height:1.55;margin-bottom:18px}
label{display:block;font-size:11px;font-weight:700;color:#64748b;letter-spacing:.08em;text-transform:uppercase;margin:18px 0 7px}
input[type=text],select{width:100%;height:42px;border:1px solid #e2e8f0;border-radius:8px;padding:0 12px;font-size:14px;font-family:inherit;color:#1a202c;outline:none;background:#fff}
input[type=text]:focus,select:focus{border-color:#0D6E6E;box-shadow:0 0 0 3px rgba(13,110,110,.08)}
.radio-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{display:flex;align-items:center;gap:8px;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;font-size:13px;color:#1a202c;cursor:pointer}
.choice input{accent-color:#0D6E6E}
.actions{display:flex;align-items:center;gap:10px;margin-top:20px}
button{height:40px;border:0;border-radius:8px;background:#0D6E6E;color:#fff;padding:0 16px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
button:hover{background:#0A5555}
.saved{font-size:12px;color:#16a34a;font-weight:700;opacity:0;transition:opacity .2s}
.saved.show{opacity:1}
.note{margin-top:16px;border-top:1px solid #e2e8f0;padding-top:14px;font-size:12px;color:#64748b;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>BREVMONT</h1>
  <div class="sub">Rep Settings</div>

  <div class="card">
    <p class="intro">These are the only settings reps control. Store-level setup comes from the invite and manager account.</p>

    <label for="p-first">Your name</label>
    <input id="p-first" type="text" placeholder="First name" autocomplete="given-name">

    <label>Tone</label>
    <div class="radio-grid">
      <label class="choice"><input type="radio" name="tone" value="professional"> Professional</label>
      <label class="choice"><input type="radio" name="tone" value="friendly"> Friendly</label>
      <label class="choice"><input type="radio" name="tone" value="casual"> Casual</label>
      <label class="choice"><input type="radio" name="tone" value="direct"> Direct</label>
    </div>

    <label for="p-goal">Goal</label>
    <select id="p-goal">
      <option value="close_deal">Close the deal</option>
      <option value="book_appointment">Book appointment</option>
      <option value="gather_info">Gather info</option>
      <option value="nurture">Nurture long-term</option>
    </select>

    <div class="actions">
      <button id="save-btn" type="button">Save preferences</button>
      <span id="saved" class="saved">Saved</span>
    </div>

    <p class="note">Need to change store-level details? Open Brevmont with Google or contact support.</p>
  </div>
</div>

<script type="module" src="./options.js"></script>
</body>
</html>
