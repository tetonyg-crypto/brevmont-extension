<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brevmont</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* 2026-07-03 Bug 2 fix — My Leads and thread views wouldn't scroll
       because body had overflow-x:hidden but no vertical overflow rule
       AND no explicit height chain, so a tall #sp-root content column
       just clipped at the visible viewport with no scrollbar affordance.
       Chrome side panels don't auto-scroll their host document. Set the
       full height chain html/body/#sp-root and let body scroll on Y. */
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #1a202c;
      background: #fff;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #sp-root {
      min-height: 100%;
    }
    /* Loading state — replaced by main.ts once panel boots */
    #sp-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
      gap: 12px;
    }
    #sp-loading .spinner {
      width: 24px; height: 24px;
      border: 3px solid #e2e8f0;
      border-top-color: #0D6E6E;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #sp-loading .label {
      font-size: 11px;
      color: #94a3b8;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="sp-loading">
    <div class="spinner"></div>
    <div class="label">Brevmont</div>
  </div>
  <div id="sp-root" style="display:none"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
