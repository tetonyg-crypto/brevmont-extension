; Brevmont prose linter config.
; Source of truth: brevmont-vault/brand/vale/
; Drop a copy of this file at the root of each repo.
;
; Scope policy (locked 2026-04-30):
;   - Editorial content under content/**/*.{md,mdx,markdown} is strictly linted
;   - Operator-facing README.md is linted (public-facing surface)
;   - Internal architecture docs (docs/**), code (src/**), and tests/** are NOT
;     linted — they are not customer-facing prose, and forcing voice rules on
;     code comments produces false positives that block CI without value
;   - Vendor / generated code (node_modules, dist, .next, .output, .vercel)
;     is excluded via Vale's IgnorePaths plus the per-repo .gitignore

StylesPath = .vale-styles
MinAlertLevel = suggestion

Vocab = Brevmont

[content/**/*.{md,mdx,markdown}]
BasedOnStyles = Brevmont

[README.md]
BasedOnStyles = Brevmont
