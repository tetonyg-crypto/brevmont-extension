; Brevmont prose linter config.
; Source of truth: brevmont-vault/brand/vale/
;
; Scope policy (locked 2026-04-30):
;   - README.md and marketing surfaces are the strict Brevmont voice
;   - Editorial essays under content/** bypass FirstPersonSingular and
;     BannedSaaSAdjectives — signed work has author personality, technical
;     prose may legitimately use 'leverage' as a verb. NoEmoji, NoEmDash,
;     LegacySaaSColor, and TestimonialFraming still apply.
;   - Internal architecture docs (docs/**), code (src/**), and tests/** are
;     not linted by Vale. Brand-color enforcement is via Stylelint.

StylesPath = .vale-styles
MinAlertLevel = suggestion

Vocab = Brevmont

[README.md]
BasedOnStyles = Brevmont

[content/**/*.{md,mdx,markdown}]
BasedOnStyles = Brevmont
Brevmont.FirstPersonSingular = NO
Brevmont.BannedSaaSAdjectives = NO
