; Brevmont prose linter config.
; Source of truth: brevmont-vault/brand/vale/
; Drop a copy of this file at the root of each repo and adjust StylesPath
; to point at .vale-styles or relative to brevmont-vault.

StylesPath = .vale-styles
MinAlertLevel = suggestion

Vocab = Brevmont

[*.{md,mdx,markdown}]
BasedOnStyles = Brevmont

[*.tsx]
BasedOnStyles = Brevmont
TokenIgnores = (?s) *<style[^>]*>.+?</style>, (?s) *<script[^>]*>.+?</script>
CommentDelimiters = //, /*, */

[*.ts]
BasedOnStyles = Brevmont
CommentDelimiters = //, /*, */
